[package]
name = "nosebleed"
version = "0.1.0"
edition = "2024"
description = "Web-first libretro runtime with low-latency browser video, audio, and input streaming"
license = "MIT"
repository = "https://github.com/longjoel/nosebleed"
homepage = "https://github.com/longjoel/nosebleed"
readme = "README.md"
keywords = ["libretro", "emulation", "websocket", "webrtc", "game-streaming"]
categories = ["emulators", "games", "web-programming::websocket"]

[lib]
name = "nosebleed"
path = "src/lib.rs"

[[bin]]
name = "nosebleed"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.98"
axum = { version = "0.8.4", features = ["ws"] }
base64 = "0.22.1"
bytes = "1.10.1"
clap = { version = "4.5.41", features = ["derive", "env"] }
gstreamer = "0.23"
gstreamer-app = "0.23"
hmac = "0.12.1"
image = { version = "0.25.6", default-features = false, features = ["png"] }
libloading = "0.8.8"
rtp = "0.12.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.8"
tokio = { version = "1.45.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
webrtc = "0.12.0"
webrtc-ice = "0.12.0"
webrtc-util = "0.10.0"

[features]
default = []
integration = []
